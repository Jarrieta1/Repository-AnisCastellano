<title>Vista previa mapeo fotos → productos</title>
<style>
  :root { --dorado:#E1B21D; --purpura:#4D1B5D; --negro:#1A1A1A; --crema:#FDFBF7; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Inter',system-ui,sans-serif; background:var(--crema); color:var(--negro); padding:24px; }
  h1 { font-size:1.3rem; color:var(--purpura); margin-bottom:4px; }
  .sub { color:#555; font-size:.9rem; margin-bottom:16px; }
  .stats { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; }
  .chip { background:#fff; border:1px solid #e6e0d5; border-radius:999px; padding:6px 14px; font-size:.82rem; }
  .chip b { color:var(--purpura); }
  .chip.warn { border-color:#c0392b; color:#c0392b; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:14px; }
  .card { background:#fff; border:1px solid #e6e0d5; border-radius:12px; overflow:hidden; position:relative; }
  .card img { width:100%; aspect-ratio:9/16; object-fit:cover; display:block; background:#eee; }
  .num { position:absolute; top:8px; left:8px; background:var(--purpura); color:#fff; font-size:.72rem; font-weight:700; border-radius:999px; padding:3px 9px; }
  .body { padding:10px 12px 12px; }
  .prod { font-size:.84rem; font-weight:600; line-height:1.3; }
  .slug { font-size:.68rem; color:#888; margin-top:4px; word-break:break-all; font-family:ui-monospace,monospace; }
  .flag { display:inline-block; font-size:.66rem; font-weight:700; border-radius:999px; padding:2px 8px; margin-top:6px; text-transform:uppercase; letter-spacing:.03em; }
  .flag.ok { background:#eafaf1; color:#1e8449; }
  .flag.duplicado { background:#fef3e2; color:#b9770e; }
  .flag.combo { background:#eaf2fb; color:#1f618d; }
  .flag.revisar { background:#fdecea; color:#c0392b; }
  h2 { font-size:1.05rem; color:var(--purpura); margin:28px 0 12px; }
  ul.missing { list-style:none; }
  ul.missing li { background:#fdecea; border:1px solid #f5b7b1; border-radius:8px; padding:8px 12px; margin-bottom:6px; font-size:.85rem; }
  .ok-msg { background:#eafaf1; border:1px solid #a9dfbf; border-radius:8px; padding:10px 14px; font-size:.88rem; }
  footer { margin-top:28px; font-size:.78rem; color:#777; }
</style>

const slug = s => s.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");

const FLAGS = {
  ok: "OK",
  duplicado: "Duplicado (secundaria)",
  combo: "Combo 2 productos",
  revisar: "Revisar etiqueta",
};

const grid = document.getElementById("grid");
const stats = document.getElementById("stats");

fetch("/api/productos").then(r => r.json()).then(productos => {
  const conFoto = new Set(ITEMS.map(i => i.p));
  const sinFoto = productos.filter(p => !conFoto.has(p.nombre));

  const chip = (label, val, warn) =>
    '<span class="chip' + (warn ? " warn" : "") + '">' + label + ": <b>" + val + "</b></span>";
  stats.innerHTML =
    chip("Fotos", ITEMS.length) +
    chip("Productos CSV", productos.length) +
    chip("Productos con foto", productos.length - sinFoto.length) +
    chip("Productos sin foto", sinFoto.length, sinFoto.length > 0);

  grid.innerHTML = ITEMS.map(i => {
    const flag = i.flag || "ok";
    const src = encodeURI(DIR + "/" + i.f);
    return '<div class="card">' +
      '<span class="num">#' + i.n + "</span>" +
      '<img loading="lazy" src="' + src + '" alt="">' +
      '<div class="body">' +
        '<div class="prod">' + i.p + "</div>" +
        '<div class="slug">img/' + slug(i.p) + ".webp</div>" +
        '<span class="flag ' + flag + '">' + FLAGS[flag] + "</span>" +
      "</div></div>";
  }).join("");

  document.getElementById("missing").innerHTML = sinFoto.length
    ? "<h2>Productos sin foto</h2><ul class='missing'>" +
      sinFoto.map(p => "<li>" + p.nombre + "</li>").join("") + "</ul>"
    : "<h2>Cobertura</h2><p class='ok-msg'>Todos los productos del CSV tienen foto asignada.</p>";
